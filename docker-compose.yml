services:
  backend:
    build:
      context: ./backend
    ports:
      - "8009:8000"
    volumes:
      - ./backend/app:/app/app
      - youmood_data:/data
    environment:
      - DATA_DIR=/data
      - SECRET_KEY=${SECRET_KEY:-dev-secret-change-in-prod}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3456,http://localhost:5173}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512m

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3456:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO/dev/null", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 64m

  backup:
    build:
      context: ./backend
    volumes:
      - youmood_data:/data
    environment:
      - DATA_DIR=/data
      - BACKUP_RETAIN_DAYS=${BACKUP_RETAIN_DAYS:-7}
    command: ["python", "/app/scripts/backup.py"]
    profiles:
      - tools

volumes:
  youmood_data:
