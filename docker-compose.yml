services:
  backend:
    build:
      context: ./backend
    ports:
      - "8009:8000"
    volumes:
      - ./backend/app:/app/app
      - youmood_data:/data
    environment:
      - DATA_DIR=/data
      - SECRET_KEY=${SECRET_KEY:-dev-secret-change-in-prod}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3456,http://localhost:5173}
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3456:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  youmood_data:
